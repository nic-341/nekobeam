<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ネコビーム！</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#58b8ff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:14px;left:14px;background:#173d70dd;color:#fff;border:3px solid #fff;border-radius:16px;padding:8px 14px;font-weight:800;font-size:17px;z-index:2}button{position:fixed;border:3px solid #fff;border-radius:24px;background:#173d70cc;color:#fff;font-size:28px;font-weight:900;box-shadow:0 4px 12px #16456a66;z-index:2}#left,#right{bottom:25px;width:82px;height:65px}#left{left:22px}#right{left:116px}#beam{right:22px;bottom:20px;width:125px;height:82px;background:#159de9dd;font-size:20px}#start{left:50%;top:50%;transform:translate(-50%,-50%);width:220px;height:70px;background:#ff7b35;font-size:25px}#msg{position:fixed;left:50%;top:28%;transform:translateX(-50%);color:#fff;text-align:center;font-size:34px;font-weight:900;text-shadow:0 3px 5px #145;z-index:2;white-space:nowrap}</style></head><body><canvas id="game"></canvas><div id="hud">🐱 HP ❤️❤️❤️　SCORE 0</div><div id="msg"></div><button id="left">◀</button><button id="right">▶</button><button id="beam">👁️ BEAM</button><button id="start">GAME START</button><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr,cat,enemies,shots,particles,score,hp,running,last,spawn,touchL=false,touchR=false,keys={};
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){cat={x:W*.18,y:H*.72,w:58,h:58};enemies=[];shots=[];particles=[];score=0;hp=3;spawn=0;running=true;last=performance.now();document.getElementById('start').style.display='none';document.getElementById('msg').textContent='';requestAnimationFrame(loop)}
function end(){running=false;document.getElementById('start').style.display='block';document.getElementById('start').textContent='もう一度遊ぶ';document.getElementById('msg').innerHTML='GAME OVER<br><span style="font-size:16px">SCORE '+score+'</span>'}
function shoot(){if(!running)return;shots.push({x:cat.x+50,y:cat.y+18,v:12});for(let i=0;i<8;i++)particles.push({x:cat.x+55,y:cat.y+18,vx:Math.random()*5,vy:(Math.random()-.5)*4,a:1})}
function hit(){hp--;if(hp<=0)end()}
function spawnEnemy(){let flying=Math.random()<.35;enemies.push({x:W+50,y:flying?H*(.25+.35*Math.random()):H*.72,w:48,h:48,v:3.2+Math.min(score/300,4)+Math.random()*1.5,flying})}
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function drawBackground(){x.fillStyle='#54b7ff';x.fillRect(0,0,W,H);x.fillStyle='#cfefff';for(let i=0;i<6;i++){let cx=(i*230-(Date.now()/40)%230);x.beginPath();x.arc(cx,H*.18+(i%2)*35,28,0,7);x.arc(cx+35,H*.18+(i%2)*35,38,0,7);x.arc(cx+70,H*.18+(i%2)*35,25,0,7);x.fill()}x.fillStyle='#4b92d1';x.beginPath();x.moveTo(0,H*.48);x.lineTo(W*.18,H*.25);x.lineTo(W*.33,H*.48);x.lineTo(W*.5,H*.28);x.lineTo(W*.72,H*.48);x.lineTo(W*.86,H*.30);x.lineTo(W,H*.48);x.lineTo(W,H);x.lineTo(0,H);x.fill();x.fillStyle='#5fbf45';x.fillRect(0,H*.72,W,H*.28);x.fillStyle='#8ee05c';x.fillRect(0,H*.72,W,8)}
function catDraw(){x.font='58px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🐱',cat.x+29,cat.y+30)}function enemyDraw(e){x.font='48px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e.flying?'🦇':'👾',e.x+24,e.y+24)}
function loop(t){if(!running)return;let dt=Math.min((t-last)/16.67,2);last=t;drawBackground();let dir=(touchR||keys.ArrowRight?1:0)-(touchL||keys.ArrowLeft?1:0);cat.x+=dir*6*dt;cat.x=Math.max(10,Math.min(W-70,cat.x));spawn+=dt;if(spawn>55){spawn=0;spawnEnemy()}for(let e of enemies)e.x-=e.v*dt;for(let s of shots)s.x+=s.v*dt;for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=.035*dt}for(let s of shots)for(let e of enemies)if(!e.dead&&collide({x:s.x,y:s.y,w:26,h:10},{x:e.x,y:e.y,w:e.w,h:e.h})){e.dead=true;s.dead=true;score+=100;for(let i=0;i<12;i++)particles.push({x:e.x+24,y:e.y+24,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,a:1})}for(let e of enemies)if(!e.dead&&collide({x:cat.x,y:cat.y,w:cat.w,h:cat.h},{x:e.x,y:e.y,w:e.w,h:e.h})){e.dead=true;hit()}enemies=enemies.filter(e=>!e.dead&&e.x>-80);shots=shots.filter(s=>!s.dead&&s.x<W+50);particles=particles.filter(p=>p.a>0);for(let s of shots){x.strokeStyle='#dfffff';x.lineWidth=12;x.shadowBlur=18;x.shadowColor='#00eaff';x.beginPath();x.moveTo(cat.x+50,cat.y+18);x.lineTo(s.x,s.y);x.stroke();x.shadowBlur=0}for(let e of enemies)enemyDraw(e);catDraw();for(let p of particles){x.globalAlpha=p.a;x.fillStyle='#fff';x.fillRect(p.x,p.y,5,5);x.globalAlpha=1}document.getElementById('hud').textContent='🐱 HP '+'❤️'.repeat(hp)+'　SCORE '+score;requestAnimationFrame(loop)}
function hold(btn,on){btn.addEventListener('touchstart',e=>{e.preventDefault();on(true)});btn.addEventListener('touchend',e=>{e.preventDefault();on(false)});btn.addEventListener('mousedown',()=>on(true));btn.addEventListener('mouseup',()=>on(false))}hold(document.getElementById('left'),v=>touchL=v);hold(document.getElementById('right'),v=>touchR=v);document.getElementById('beam').addEventListener('touchstart',e=>{e.preventDefault();shoot()});document.getElementById('beam').addEventListener('mousedown',shoot);document.getElementById('start').addEventListener('click',reset);addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space')shoot()});addEventListener('keyup',e=>keys[e.key]=false);drawBackground();cat={x:W*.18,y:H*.72,w:58,h:58};catDraw();
</script></body></html>
