<div id="laser"></div>
<div id="controls">
<button id="idle">待機</button><button id="walk">歩く</button><button id="run">走る</button><button id="jump">ジャンプ</button><button id="beam">レーザー</button>
</div>
</div>
<script>
const cat=document.getElementById('cat'), laser=document.getElementById('laser');
let mode='idle', t=0, jumpStart=0;
function setMode(m){mode=m;if(m==='beam')setTimeout(()=>{if(mode==='beam')mode='idle'},180);}
function loop(now){
 t=now/1000;
 let y=0, r=0, sx=1, sy=1;
 if(mode==='walk'){y=Math.sin(t*9)*2;r=Math.sin(t*9)*.6}
 if(mode==='run'){y=Math.sin(t*14)*3;r=Math.sin(t*14)*1;sx=1.01;sy=.995}
 if(mode==='jump'){const q=(t-jumpStart); if(q>1.1)mode='idle'; else y=-Math.sin(Math.min(q,1.1)/1.1*Math.PI)*105}
 if(mode==='beam'){laser.style.display='block'} else laser.style.display='none';
 cat.style.transform=`translateX(-50%) translateY(${y}px) rotate(${r}deg) scale(${sx},${sy})`;
 requestAnimationFrame(loop);
}
document.getElementById('idle').onpointerdown=e=>{e.preventDefault();setMode('idle')};
document.getElementById('walk').onpointerdown=e=>{e.preventDefault();setMode('walk')};
document.getElementById('run').onpointerdown=e=>{e.preventDefault();setMode('run')};
document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jumpStart=performance.now()/1000;setMode('jump')};
document.getElementById('beam').onpointerdown=e=>{e.preventDefault();setMode('beam')};
requestAnimationFrame(loop);
</script>
</body>
