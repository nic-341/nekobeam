const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,dpr=1; function resize(){dpr=Math.min(1.25,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);} addEventListener('resize',resize);resize();
const imgs={}; for(const [k,arr] of Object.entries(ASSETS)){imgs[k]=arr.map(o=>{const im=new Image();im.src=o.data;return im})}
let p={x:180,y:0,vx:0,vy:0,onGround:false,dir:1,walkT:0,jumpT:0,laserT:0};
const keys={left:false,right:false}; const groundY=()=>H*0.74;
const shots=[]; let last=performance.now();
function reset(){p.x=180;p.y=groundY()-105;p.vx=0;p.vy=0;p.onGround=true;p.dir=1;p.walkT=0;p.jumpT=0;shots.length=0}
function bind(btn,down,up){btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);down();},{passive:false});['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,e=>{e.preventDefault();up&&up();},{passive:false}));}
bind(document.getElementById('left'),()=>keys.left=true,()=>keys.left=false);bind(document.getElementById('right'),()=>keys.right=true,()=>keys.right=false);
bind(document.getElementById('jump'),()=>{if(p.onGround){p.vy=-760;p.onGround=false;p.jumpT=0}},()=>{});
let laserCooldown=0; bind(document.getElementById('laser'),()=>fireLaser(),()=>{});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key==='ArrowUp'||e.key===' '){e.preventDefault();if(p.onGround){p.vy=-760;p.onGround=false}}if(e.key==='z'||e.key==='Z')fireLaser()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
function fireLaser(){if(laserCooldown>0)return;laserCooldown=.12;shots.push({x:p.x+p.dir*48,y:p.y-55,vx:p.dir*1050,life:0.48});}
function drawBg(){ctx.fillStyle='#8fd3ff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<5;i++){const x=(i*280-(p.x*.12)%280);ctx.beginPath();ctx.arc(x+40,H*.2,28,0,7);ctx.arc(x+75,H*.19,36,0,7);ctx.arc(x+115,H*.21,25,0,7);ctx.fill()}ctx.fillStyle='#6aa8c9';ctx.beginPath();ctx.moveTo(0,H*.48);for(let x=0;x<=W+160;x+=80)ctx.lineTo(x,H*.36+Math.sin(x*.018)*45);ctx.lineTo(W,H*.74);ctx.lineTo(0,H*.74);ctx.fill();ctx.fillStyle='#4e9a57';ctx.fillRect(0,groundY(),W,H-groundY());ctx.fillStyle='#3d7f45';ctx.fillRect(0,groundY()+9,W,8);}
function spriteFor(){let moving=Math.abs(p.vx)>20; if(!p.onGround){let f=Math.min(3,Math.floor(p.jumpT/0.11));return ['jump',f]} if(moving){let f=Math.floor(p.walkT/0.1)%4;return ['walk',f]} return ['idle',Math.floor(performance.now()/220)%4]}
function drawCat(){const [set,i]=spriteFor(),im=imgs[set][i];if(!im.complete)return;const w=im.naturalWidth*0.68,h=im.naturalHeight*0.68;ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.dir,1);let bob=(p.onGround&&Math.abs(p.vx)>20)?Math.sin(p.walkT*18)*2:0;ctx.drawImage(im,-w*.48,-h+bob,w,h);ctx.restore();}
function drawShots(dt){for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;s.life-=dt;if(s.life<=0){shots.splice(i,1);continue}ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineWidth=10;ctx.strokeStyle='rgba(90,220,255,.35)';ctx.beginPath();ctx.moveTo(s.x-s.vx*.018,s.y);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle='#e8ffff';ctx.beginPath();ctx.moveTo(s.x-s.vx*.018,s.y);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.restore()}}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;laserCooldown=Math.max(0,laserCooldown-dt);p.walkT+=dt;p.jumpT+=dt;p.vy+=1900*dt;p.x+=(keys.right?1:0)*300*dt-(keys.left?1:0)*300*dt;if(keys.right)p.dir=1;if(keys.left)p.dir=-1;p.vx=(keys.right?300:keys.left?-300:0);p.y+=p.vy*dt;const gy=groundY()-105;if(p.y>=gy){p.y=gy;p.vy=0;p.onGround=true}else p.onGround=false;p.x=Math.max(70,Math.min(3600,p.x));drawBg();ctx.save();ctx.translate(-Math.max(0,p.x-W*.35),0); // stage coords
for(let x=0;x<4200;x+=220){ctx.fillStyle='#fff7d8';ctx.beginPath();ctx.arc(x+60,groundY()-18,4,0,7);ctx.fill();ctx.fillStyle='#ffe16b';ctx.fillRect(x+120,groundY()-10,50,5)}
// laser in world coords
drawShots(dt);drawCat();ctx.restore();ctx.fillStyle='rgba(0,0,0,.55)';ctx.font='700 15px sans-serif';ctx.fillText('移動：← →　 ジャンプ：▲　レーザー：⚡',16,32);requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
