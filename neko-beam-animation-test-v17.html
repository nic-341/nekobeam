const images={}; for(const k in IMG){images[k]=new Image();images[k].src=IMG[k]}
const keys={l:false,r:false};
let p={x:120,y:0,w:90,h:90,vx:0,vy:0,on:true,face:1,t:0};
const WORLD=4200;
function resize(){DPR=Math.min(devicePixelRatio||1,1.25);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);groundY=H*.72;p.y=groundY-p.h} addEventListener('resize',resize);resize();
function reset(){p.x=120;p.y=groundY-p.h;p.vx=0;p.vy=0;p.on=true;p.face=1;p.t=0;cameraX=0;}
function jump(){if(p.on){p.vy=-700;p.on=false}}
function hold(id,on,off){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();on();try{b.setPointerCapture(e.pointerId)}catch(_){}});b.addEventListener('pointerup',e=>{e.preventDefault();if(off)off()});b.addEventListener('pointercancel',()=>off&&off());}
hold('left',()=>keys.l=true,()=>keys.l=false);hold('right',()=>keys.r=true,()=>keys.r=false);document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('restart').addEventListener('pointerdown',e=>{e.preventDefault();reset()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.key==='ArrowUp'||e.key===' ')jump()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
function update(dt){const dir=(keys.r?1:0)-(keys.l?1:0);p.vx+=dir*1900*dt;p.vx*=Math.pow(.0005,dt);p.vx=Math.max(-300,Math.min(300,p.vx));if(Math.abs(p.vx)>5)p.face=p.vx>0?1:-1;p.x+=p.vx*dt;p.vy+=1750*dt;p.y+=p.vy*dt;if(p.y+p.h>=groundY){p.y=groundY-p.h;p.vy=0;p.on=true}else p.on=false;p.x=Math.max(0,Math.min(WORLD-p.w,p.x));p.t+=dt;cameraX=Math.max(0,Math.min(WORLD-W,p.x-W*.32));
let st='待機中';if(!p.on)st='ジャンプ';else if(Math.abs(p.vx)>35)st='歩く';document.getElementById('state').textContent=st;
}
function drawBackground(){ctx.fillStyle='#69c8ee';ctx.fillRect(0,0,W,H);ctx.fillStyle='#8dbbd0';for(let i=-1;i<8;i++){const x=i*330-cameraX*.12;ctx.beginPath();ctx.moveTo(x,groundY);ctx.lineTo(x+165,H*.22);ctx.lineTo(x+330,groundY);ctx.fill()}ctx.fillStyle='#ffffffb0';for(let i=-1;i<8;i++){const x=i*360-cameraX*.07,y=100+(i%2)*50;ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.arc(x+32,y-5,29,0,7);ctx.arc(x+64,y+3,21,0,7);ctx.fill()}}
function drawGround(){ctx.fillStyle='#61c84c';ctx.fillRect(-cameraX,groundY,WORLD,24);ctx.fillStyle='#704c34';ctx.fillRect(-cameraX,groundY+24,WORLD,H-groundY-24);for(let x=0;x<WORLD;x+=48){ctx.fillStyle=x%96?'#866047':'#5e452f';ctx.fillRect(x-cameraX,groundY+35,30,12)}}
function drawGoal(){const gx=WORLD-360-cameraX;const gy=groundY-155;ctx.fillStyle='#d69b58';ctx.beginPath();ctx.moveTo(gx,gy+45);ctx.lineTo(gx+70,gy-15);ctx.lineTo(gx+140,gy+45);ctx.closePath();ctx.fill();ctx.fillRect(gx+12,gy+40,116,115);ctx.fillStyle='#6f4327';ctx.beginPath();ctx.arc(gx+70,gy+155,30,Math.PI,0);ctx.fillRect(gx+40,gy+125,60,30);ctx.fill();ctx.fillStyle='#7b4b2b';ctx.font='900 20px system-ui';ctx.fillText('GOAL',gx+37,gy+100)}
function drawCat(){let set;if(!p.on)set=['jump1','jump2','jump3','jump4'];else if(Math.abs(p.vx)>35)set=['walk1','walk2','walk3','walk4'];else set=['idle1','idle2','idle3','idle4'];const idx=Math.floor(p.t*(Math.abs(p.vx)>35?8:3))%set.length;const img=images[set[idx]];if(!img.complete)return;const dw=105,dh=105;const x=p.x-cameraX-8,y=p.y-7;ctx.save();if(p.face<0){ctx.translate(x+dw,y);ctx.scale(-1,1);ctx.drawImage(img,0,0,dw,dh)}else ctx.drawImage(img,x,y,dw,dh);ctx.restore()}
function draw(){drawBackground();drawGround();drawGoal();drawCat()}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
