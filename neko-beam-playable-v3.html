<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ねこビーム！ Stage 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#72c9ef;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 2px 4px #123}
.badge{background:#082a58e8;border:2px solid #bcecff;border-radius:15px;padding:7px 11px;white-space:nowrap}
#sound{position:fixed;right:10px;top:max(62px,calc(env(safe-area-inset-top) + 54px));z-index:9;border:2px solid #bcecff;border-radius:14px;background:#082a58ef;color:#fff;padding:8px 12px;font-weight:900;touch-action:manipulation}
#hint{position:fixed;left:10px;top:max(62px,calc(env(safe-area-inset-top) + 54px));z-index:6;color:#fff;background:#082a58c9;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:800;pointer-events:none}
#controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 12px;z-index:8;pointer-events:none}
.grp{display:flex;gap:10px}
.ctrl{pointer-events:auto;width:82px;height:68px;border-radius:21px;border:2px solid #c9f2ff;background:#0b3c79e8;color:#fff;font-size:31px;font-weight:900;box-shadow:0 5px 14px #0005;touch-action:none}
.ctrl:active{transform:scale(.94);background:#1468bf}
#message{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0006;z-index:30}
.card{background:#092750f7;color:#fff;border:3px solid #bcecff;border-radius:24px;padding:25px 30px;text-align:center;font-weight:900;font-size:24px;box-shadow:0 12px 40px #0008}
.card button{margin-top:15px;border:0;border-radius:15px;padding:12px 24px;font-size:18px;font-weight:900}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="badge">❤️ <span id="hp">3</span>　🐾 <span id="coin">0</span></div>
  <div class="badge">SCORE <span id="score">0</span></div>
  <div class="badge">STAGE 1</div>
</div>
<div id="hint">← → 移動　↑ ジャンプ　👁 ビーム</div>
<button id="sound">🔊 音をON</button>
<div id="controls">
  <div class="grp"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
  <div class="grp"><button class="ctrl" id="jump">▲</button><button class="ctrl" id="beam">👁</button></div>
</div>
<div id="message"><div class="card"><div id="messageText"></div><button id="restart">🔄 リスタート</button></div></div>

      audioReady=true;
      const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;
      o.type='sine';o.frequency.setValueAtTime(520,t);
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.08,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.11);
      o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.12);
      document.getElementById('sound').textContent='🔊 音ON';
    }
  }catch(e){}
}
function tone(freq,dur,type='sine',vol=.08,slide=0){
  if(!soundOn||!audioReady||!audio||audio.state!=='running')return;
  const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.linearRampToValueAtTime(Math.max(50,freq+slide),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.02);
}
function sJump(){tone(500,.11,'square',.09,260)}
function sBeam(){tone(170,.14,'sawtooth',.055,600)}
function sHit(){tone(120,.12,'square',.08,-60)}
function sCoin(){tone(900,.07,'sine',.08,250);setTimeout(()=>tone(1200,.08,'sine',.06),65)}
function sHurt(){tone(90,.22,'sawtooth',.09,-50)}
function sClear(){tone(660,.15);setTimeout(()=>tone(830,.15),120);setTimeout(()=>tone(1040,.2),240)}

const keys={left:false,right:false};
let player,platforms,enemies,coins,shots,particles,cameraX,score,hp,running;

// Platforms are explicit: every solid surface is exactly where it is drawn.
function makePlatforms(){
  const y=H*.72;
  return [
    {x:0,   y:y,   w:520,h:80},
    {x:600, y:y-80,w:260,h:80},
    {x:930, y:y,   w:280,h:80},
    {x:1270,y:y-95,w:250,h:80},
    {x:1580,y:y-10,w:330,h:90},
    {x:1970,y:y-75,w:300,h:80},
    {x:2320,y:y,   w:420,h:90}
  ];
}
function reset(){
  platforms=makePlatforms();
  player={x:120,y:platforms[0].y-58,w:58,h:58,vx:0,vy:0,on:false,face:1,inv:0,walk:0};
  enemies=[
    {x:690,y:0,w:48,h:38,platform:1,vx:55,hp:2,type:'slime'},
    {x:1030,y:0,w:48,h:38,platform:2,vx:-50,hp:2,type:'slime'},
    {x:1340,y:0,w:52,h:40,platform:3,vx:45,hp:2,type:'bat'},
    {x:1710,y:0,w:48,h:38,platform:4,vx:-55,hp:2,type:'slime'},
    {x:2100,y:0,w:52,h:40,platform:5,vx:55,hp:3,type:'mushroom'}
  ];
  coins=[
    {x:420,p:0,got:false},{x:650,p:1,got:false},{x:770,p:1,got:false},
    {x:1080,p:2,got:false},{x:1350,p:3,got:false},{x:1430,p:3,got:false},
    {x:1780,p:4,got:false},{x:1860,p:4,got:false},{x:2140,p:5,got:false},
    {x:2480,p:6,got:false}
  ];
  shots=[];particles=[];cameraX=0;score=0;hp=3;running=true;
  document.getElementById('message').style.display='none';hud();
}
function platformY(i){return platforms[i].y}
function tryJump(){
  makeAudio();
  if(running&&player.on){player.vy=-720;player.on=false;sJump()}
}
function fire(){
  makeAudio();
  if(!running)return;
  shots.push({x:player.x+player.face*32,y:player.y+25,v:player.face*950,life:.55});
  sBeam();
}
function hurt(){
  if(player.inv>0)return;
  hp--;player.inv=1.05;sHurt();
  if(hp<=0){running=false;show('ゲームオーバー…')}
}
function show(t){document.getElementById('messageText').textContent=t;document.getElementById('message').style.display='flex'}
function hud(){document.getElementById('hp').textContent=hp;document.getElementById('score').textContent=score}

function bindHold(id,down,up){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();makeAudio();down();try{b.setPointerCapture(e.pointerId)}catch(_){}});
  b.addEventListener('pointerup',e=>{e.preventDefault();if(up)up()});
  b.addEventListener('pointercancel',()=>{if(up)up()});
}
bindHold('left',()=>keys.left=true,()=>keys.left=false);
bindHold('right',()=>keys.right=true,()=>keys.right=false);
bindHold('jump',tryJump);
bindHold('beam',fire);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')keys.left=true;
  if(e.key==='ArrowRight')keys.right=true;
  if(e.key==='ArrowUp'||e.key===' ')tryJump();
  if(e.key==='z'||e.key==='Z')fire();
});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
document.getElementById('sound').addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!soundOn){soundOn=true;makeAudio()}else{makeAudio();tone(740,.15,'sine',.1,100)}
  e.currentTarget.textContent='🔊 音ON';
});
document.getElementById('restart').addEventListener('pointerdown',e=>{e.preventDefault();makeAudio();reset()});

function burst(x,y){
  for(let i=0;i<14;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:(Math.random()-.7)*250,t:.45});
}
function update(dt){
  if(!running)return;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  player.vx += dir*1700*dt;
  player.vx *= Math.pow(.0007,dt);
  player.vx=Math.max(-300,Math.min(300,player.vx));
  if(player.vx>3)player.face=1;if(player.vx<-3)player.face=-1;
  const oldBottom=player.y+player.h;
  player.x+=player.vx*dt;
  player.vy+=1800*dt;
  player.y+=player.vy*dt;
  player.on=false;

  // Only land on an actual platform when falling and crossing its top.
  if(player.vy>=0){
    for(const pl of platforms){
      if(player.x+player.w*.72>pl.x && player.x+player.w*.28<pl.x+pl.w &&
         oldBottom<=pl.y+4 && player.y+player.h>=pl.y){
        player.y=pl.y-player.h;player.vy=0;player.on=true;break;
      }
    }
  }
  if(player.x<0)player.x=0;

  // Falling means immediately leaving the stage, not continuing in the air.
  if(player.y>H+80){running=false;show('落下しました…');return}
  player.inv=Math.max(0,player.inv-dt);player.walk+=dt*12;
  cameraX=Math.max(0,Math.min(1990,player.x-W*.30));

  for(const e of enemies){
    const pl=platforms[e.platform];
    const min=pl.x+12,max=pl.x+pl.w-12;
    e.x+=e.vx*dt;
    if(e.x<min||e.x>max){e.x=Math.max(min,Math.min(max,e.x));e.vx*=-1}
    e.y=pl.y-e.h-(e.type==='bat'?115+Math.sin(performance.now()/220)*18:0);
    if(e.hp>0 && Math.abs(e.x-player.x)<45 && Math.abs((e.y+e.h/2)-(player.y+player.h/2))<48)hurt();
  }

  for(const s of shots){
    s.x+=s.v*dt;s.life-=dt;
    for(const e of enemies){
      if(e.hp>0&&Math.abs(s.x-e.x)<43&&Math.abs(s.y-(e.y+e.h/2))<42){
        e.hp--;s.life=0;score+=100;sHit();burst(e.x,e.y+e.h/2);
      }
    }
  }
  shots=shots.filter(s=>s.life>0&&s.x>cameraX-120&&s.x<cameraX+W+180);

  for(const c of coins){
    const pl=platforms[c.p];
    const cy=pl.y-35;
    if(!c.got&&Math.abs(c.x-player.x)<32&&Math.abs(cy-(player.y+player.h/2))<58){
      c.got=true;score+=50;sCoin();
    }
  }
  document.getElementById('coin').textContent=coins.filter(c=>c.got).length;

  if(player.x>2630){
    running=false;score+=1000;show('🎉 ステージクリア！');sClear();
  }
  hud();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#55c7ff');g.addColorStop(1,'#e0f8ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // distant mountains
  ctx.fillStyle='#8dbdd3';
  for(let i=-1;i<10;i++){let x=i*310-(cameraX*.15%310);ctx.beginPath();ctx.moveTo(x,H*.58);ctx.lineTo(x+155,H*.17);ctx.lineTo(x+325,H*.58);ctx.fill()}
  // distant lake
  ctx.fillStyle='#78cce2';ctx.fillRect(0,H*.53,W,H*.47);
  // clouds
  ctx.fillStyle='#fff9';
  for(let i=0;i<7;i++){let x=i*330-(cameraX*.06%330);ctx.beginPath();ctx.arc(x+45,110+(i%2)*55,25,0,7);ctx.arc(x+80,102+(i%2)*55,34,0,7);ctx.arc(x+118,112+(i%2)*55,24,0,7);ctx.fill()}

  // platforms: same exact geometry used by collision.
  for(const pl of platforms){
    const x=pl.x-cameraX;
    ctx.fillStyle='#5a3e2b';ctx.fillRect(x,pl.y,pl.w,H-pl.y+120);
    ctx.fillStyle='#58d253';ctx.fillRect(x,pl.y,pl.w,14);
    ctx.fillStyle='#8b6746';
    for(let k=0;k<Math.floor(pl.w/45);k++)ctx.fillRect(x+10+k*45,pl.y+32,25,10);
  }

  // goal flag
  ctx.fillStyle='#eee';ctx.fillRect(2670-cameraX,platforms[6].y-115,7,115);
  ctx.fillStyle='#ef4c63';ctx.beginPath();ctx.moveTo(2677-cameraX,platforms[6].y-112);ctx.lineTo(2740-cameraX,platforms[6].y-82);ctx.lineTo(2677-cameraX,platforms[6].y-55);ctx.fill();

  // coins
  for(const c of coins)if(!c.got){
    const cy=platforms[c.p].y-35,x=c.x-cameraX;
    ctx.fillStyle='#ffd23d';ctx.beginPath();ctx.ellipse(x,cy,15,20,0,0,7);ctx.fill();
    ctx.fillStyle='#fff3a0';ctx.font='15px sans-serif';ctx.fillText('🐾',x-9,cy+6);
  }

  // enemies
  for(const e of enemies)if(e.hp>0){
    const x=e.x-cameraX;
    if(e.type==='bat'){
      ctx.fillStyle='#5d3c8e';ctx.beginPath();ctx.ellipse(x,e.y,25,18,0,0,7);ctx.fill();
      ctx.fillStyle='#9b66cf';ctx.beginPath();ctx.moveTo(x-8,e.y);ctx.lineTo(x-52,e.y-28);ctx.lineTo(x-28,e.y+12);ctx.fill();
      ctx.beginPath();ctx.moveTo(x+8,e.y);ctx.lineTo(x+52,e.y-28);ctx.lineTo(x+28,e.y+12);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='17px sans-serif';ctx.fillText('• •',x-12,e.y+6);
    }else if(e.type==='mushroom'){
      ctx.fillStyle='#ef704d';ctx.beginPath();ctx.arc(x,e.y+12,25,Math.PI,0);ctx.fill();
      ctx.fillStyle='#f8dca8';ctx.fillRect(x-25,e.y+12,50,23);
      ctx.fillStyle='#222';ctx.font='19px sans-serif';ctx.fillText('• •',x-13,e.y+29);
    }else{
      ctx.fillStyle='#69d95b';ctx.beginPath();ctx.ellipse(x,e.y+22,30,22,0,0,7);ctx.fill();
      ctx.fillStyle='#163a2b';ctx.font='21px sans-serif';ctx.fillText('•ᴗ•',x-18,e.y+29);
    }
  }

  // beam
  for(const s of shots){ctx.strokeStyle='#8cffff';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(s.x-cameraX,s.y);ctx.lineTo(s.x-cameraX-s.v*.055,s.y);ctx.stroke()}

  // cat image; the entire image is mirrored, so body/tail/legs turn together.
  if(player.inv<=0||Math.floor(player.inv*16)%2===0){
    const sc=.42,w=catImg.width*sc,h=catImg.height*sc;
    ctx.save();ctx.translate(player.x-cameraX+player.w/2,player.y+player.h+2);
    if(player.face<0)ctx.scale(-1,1);
    ctx.shadowColor='#62eaff';ctx.shadowBlur=5;
    ctx.drawImage(catImg,-w/2,-h*.72,w,h);ctx.restore();
  }

  // particles
  for(const q of particles){q.x+=q.vx*.016;q.y+=q.vy*.016;q.t-=.016;ctx.fillStyle='#fff';ctx.fillRect(q.x-cameraX,q.y,5,5)}
  particles=particles.filter(q=>q.t>0);
}

let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
