<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ネコビーム 2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79d9ff;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}.controls{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.g{display:flex;gap:10px}button{pointer-events:auto;touch-action:none;width:76px;height:64px;border:2px solid #fff;border-radius:20px;background:#17324ddd;color:white;font-size:27px;font-weight:900;box-shadow:0 5px 12px #0005}.jump{width:88px}.beam{width:112px;font-size:17px;background:#0872cfee}#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:white;font:900 30px system-ui;text-shadow:0 4px 8px #000;background:#0005}#msg div{font-size:15px;margin-top:10px}</style></head><body><canvas id="c"></canvas><div class="controls"><div class="g"><button id="l">◀</button><button id="r">▶</button></div><div class="g"><button class="jump" id="j">⬆</button><button class="beam" id="b">👁️ BEAM</button></div></div><div id="msg"></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),M=document.getElementById('msg');let W,H,D,cam=0,score=0,coins=0,last=0,run=true;const G=()=>H-112,world=7000;function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
let p={x:170,y:0,w:58,h:62,vx:0,vy:0,on:true,hp:3,inv:0,face:1,beam:0};const plats=[[0,1050,0],[1200,900,0],[2250,950,0],[3400,850,0],[4450,2550,0],[610,230,1],[1420,250,1],[1740,250,1],[2600,250,1],[2960,270,1],[3710,250,1],[4100,250,1],[4850,260,1],[5350,300,1]];const pits=[[1050,150],[2100,150],[3200,200],[4250,200]];let enemies=[500,850,1380,1900,2500,3050,3600,4020,4750,5550].map((v,i)=>({x:v,base:v,type:i%2,w:48,h:48,v:i%2?55:-55,dead:false}));let cs=[420,690,770,1450,1810,2640,3010,3770,4140,4930,5410,5680,5850].map((x,i)=>({x,y:i%3?G()-190:G()-250,taken:false}));let keys={l:false,r:false},shots=[];
function py(q){if(!q[2])return G();if(q[0]==4200)return H-280;if(q[0]==1480||q[0]==2700)return H-235;if(q[0]==1800||q[0]==3050||q[0]==4900)return H-170;return H-220}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function land(){let z=null;for(const q of plats){let y=py(q);if(p.x+p.w-5>q[0]&&p.x+5<q[0]+q[1]&&p.y+p.h<=y+15&&p.y+p.h+p.vy*.016>=y)z=y}return z}function hurt(){if(p.inv)return;p.hp--;p.inv=1.2;p.vy=-430;p.vx=-p.face*280;if(p.hp<=0)end('💥 GAME OVER','タップでリスタート')}function jump(){if(run&&p.on){p.vy=-760;p.on=false}}function fire(){if(run){p.beam=.24;shots.push({x:p.face>0?p.x+p.w:p.x-620,y:p.y+25,w:620,h:14,v:p.face*1050,life:.34})}}function btn(id,down,up){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.setPointerCapture?.(e.pointerId);down()});b.addEventListener('pointerup',e=>{e.preventDefault();up&&up()});b.addEventListener('pointercancel',()=>up&&up())}btn('l',()=>keys.l=1,()=>keys.l=0);btn('r',()=>keys.r=1,()=>keys.r=0);btn('j',jump);btn('b',fire);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});onkeydown=e=>{if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='z'||e.key==='x')fire()};onkeyup=e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0};function end(a,b){run=false;M.style.display='flex';M.innerHTML=a+'<div>'+b+'</div>'}M.onpointerdown=reset;function reset(){Object.assign(p,{x:170,y:G()-62,vx:0,vy:0,on:true,hp:3,inv:0,face:1,beam:0});cam=score=coins=0;shots=[];enemies.forEach(e=>{e.x=e.base;e.dead=false});cs.forEach(e=>e.taken=false);run=true;M.style.display='none'}
function sky(t){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#65d2ff');g.addColorStop(1,'#effcff');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#ffffffaa';for(let i=-1;i<8;i++){let xx=i*380-(cam*.08%380),y=70+(i%3)*45;X.beginPath();X.arc(xx,y,30,0,7);X.arc(xx+38,y-10,42,0,7);X.arc(xx+80,y,28,0,7);X.fill()}X.fillStyle='#78b7c8';for(let i=-2;i<10;i++){let xx=i*520-(cam*.15%520);X.beginPath();X.moveTo(xx,H-175);X.lineTo(xx+260,H-390);X.lineTo(xx+520,H-175);X.fill()}}
function worldDraw(t){for(let i=-2;i<22;i++){let xx=i*300-(cam*.25%300);X.fillStyle='#4b9a60';X.beginPath();X.arc(xx,H-155,65,0,7);X.fill()}X.fillStyle='#22334e';pits.forEach(q=>X.fillRect(q[0]-cam,H-112,q[1],112));for(const q of plats){let xx=q[0]-cam,y=py(q);if(xx+q[1]<-20||xx>W+20)continue;X.fillStyle='#72ca51';X.fillRect(xx,y,q[1],10);X.fillStyle='#6b4931';X.fillRect(xx,y+10,q[1],28)}cs.forEach(co=>{if(co.taken)return;let xx=co.x-cam;X.fillStyle='#ffd329';X.beginPath();X.arc(xx,co.y,13,0,7);X.fill();X.fillStyle='#fff4a0';X.beginPath();X.arc(xx-4,co.y-4,4,0,7);X.fill()});enemies.forEach(e=>{if(e.dead)return;let xx=e.x-cam,y=e.y;if(!e.type){X.fillStyle='#6cda59';X.beginPath();X.ellipse(xx+24,y+29,25,20,0,0,7);X.fill();X.fillStyle='white';X.beginPath();X.arc(xx+15,y+25,7,0,7);X.arc(xx+33,y+25,7,0,7);X.fill();X.fillStyle='#222';X.beginPath();X.arc(xx+15,y+25,3,0,7);X.arc(xx+33,y+25,3,0,7);X.fill()}else{X.fillStyle='#704aa4';X.beginPath();X.ellipse(xx+24,y+26,18,14,0,0,7);X.fill();X.beginPath();X.moveTo(xx+10,y+22);X.lineTo(xx-10,y-5);X.lineTo(xx+4,y+31);X.fill();X.beginPath();X.moveTo(xx+38,y+22);X.lineTo(xx+58,y-5);X.lineTo(xx+44,y+31);X.fill();X.fillStyle='#ffe15a';X.fillRect(xx+14,y+22,4,5);X.fillRect(xx+31,y+22,4,5)}});let fx=6500-cam;X.fillStyle='#444';X.fillRect(fx,H-290,8,178);X.fillStyle='#ed4e55';X.beginPath();X.moveTo(fx+8,H-285);X.lineTo(fx+90,H-255);X.lineTo(fx+8,H-225);X.fill();X.font='34px sans-serif';X.fillText('🐾',fx+25,H-250)}
function cat(){let xx=p.x-cam,y=p.y;X.save();if(p.inv&&Math.floor(p.inv*12)%2===0)X.globalAlpha=.35;X.fillStyle='#0003';X.beginPath();X.ellipse(xx+29,y+61,27,6,0,0,7);X.fill();X.strokeStyle='#eee';X.lineWidth=9;X.lineCap='round';X.beginPath();X.moveTo(xx+9,y+43);X.quadraticCurveTo(xx-18,y+25,xx+5,y+9);X.stroke();X.fillStyle='#f7f7f7';X.beginPath();X.ellipse(xx+30,y+39,24,18,0,0,7);X.fill();X.beginPath();X.arc(xx+32,y+23,23,0,7);X.fill();X.beginPath();X.moveTo(xx+13,y+9);X.lineTo(xx+17,y-13);X.lineTo(xx+29,y+6);X.fill();X.beginPath();X.moveTo(xx+34,y+6);X.lineTo(xx+49,y-13);X.lineTo(xx+52,y+12);X.fill();X.fillStyle='#31a8ff';let ex=xx+(p.face>0?43:21);X.beginPath();X.arc(ex,y+20,5,0,7);X.fill();X.fillStyle='#123';X.beginPath();X.arc(ex,y+20,2,0,7);X.fill();X.fillStyle='#1768d8';X.beginPath();X.moveTo(xx+30+p.face*34,y-25);X.lineTo(xx+20+p.face*34,y-10);X.lineTo(xx+40+p.face*34,y-10);X.fill();X.strokeStyle='#ddd';X.lineWidth=7;X.beginPath();X.moveTo(xx+17,y+48);X.lineTo(xx+14,y+60);X.moveTo(xx+39,y+48);X.lineTo(xx+43,y+60);X.stroke();if(p.beam){let sx=p.face>0?xx+52:xx-2,g=X.createLinearGradient(sx,y+25,sx+p.face*620,y+25);g.addColorStop(0,'#fff');g.addColorStop(.3,'#7ff');g.addColorStop(1,'#8b5cff');X.strokeStyle=g;X.lineWidth=16;X.shadowBlur=18;X.shadowColor='#4ff';X.beginPath();X.moveTo(sx,y+25);X.lineTo(sx+p.face*620,y+25);X.stroke()}X.restore()}
function hud(){X.fillStyle='#142b4ddd';X.beginPath();X.roundRect(14,14,290,82,18);X.fill();X.fillStyle='#fff';X.font='bold 20px system-ui';X.textAlign='left';X.fillText('❤️'.repeat(p.hp)+'🖤'.repeat(3-p.hp),28,43);X.fillText('SCORE '+String(score).padStart(5,'0'),28,72);X.fillText('🪙 '+coins,205,43);X.font='bold 15px system-ui';X.fillText('STAGE 1',207,72)}
function draw(t){X.clearRect(0,0,W,H);sky(t);worldDraw(t);cat();hud()}function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;if(run){let a=keys.l?-1050:keys.r?1050:0;if(a){p.vx+=a*dt;p.face=a>0?1:-1}else p.vx*=Math.pow(.0004,dt);p.vx=Math.max(-340,Math.min(340,p.vx));p.vy+=1900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.on=false;let y=land();if(y!==null&&p.vy>=0){p.y=y-p.h;p.vy=0;p.on=true}if(p.y>H+90){hurt();p.y=G()-p.h}p.inv=Math.max(0,p.inv-dt);p.beam=Math.max(0,p.beam-dt);enemies.forEach(e=>{if(e.dead)return;e.y=G()-e.h-(e.type?105+Math.sin(t/230+e.base)*25:0);e.x+=e.v*dt;if(Math.abs(e.x-p.x)<500&&Math.sign(p.x-e.x)!==Math.sign(e.v))e.v*=-1;if(hit(p,e))hurt()});shots.forEach(s=>{s.x+=s.v*dt;s.life-=dt;enemies.forEach(e=>{if(!e.dead&&s.x<e.x+e.w&&s.x+s.w>e.x&&s.y<e.y+e.h&&s.y+s.h>e.y){e.dead=true;score+=100}})});shots.splice(0,shots.length,...shots.filter(s=>s.life>0));cs.forEach(co=>{if(!co.taken&&Math.abs(p.x-co.x)<42&&Math.abs(p.y-co.y)<65){co.taken=true;coins++;score+=20}});cam+=(Math.max(0,p.x-W*.3)-cam)*Math.min(1,dt*7);cam=Math.max(0,Math.min(world-W,cam));if(p.x>6450){score+=500;end('🏆 STAGE CLEAR!','スコア '+score+'　タップでリスタート')}}draw(t);requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
