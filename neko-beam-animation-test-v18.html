const c=document.getElementById('c'),ctx=c.getContext('2d'); let left=false,right=false,jump=false; const p={x:120,y:400,vx:0,vy:0,onGround:true,dir:1,anim:0,jumpT:0};
function bind(id,prop){const b=document.getElementById(id); const on=e=>{e.preventDefault(); window[prop]=true;}; const off=e=>{e.preventDefault(); window[prop]=false;}; b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);}
bind('left','left');bind('right','right');bind('jump','jump');window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true;if(e.key===' '||e.key==='ArrowUp')jump=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false;if(e.key===' '||e.key==='ArrowUp')jump=false});
function frameKey(){if(!p.onGround) return 'jump'+(Math.min(3,Math.floor(p.jumpT/0.11))+1); if(Math.abs(p.vx)>0.1) return 'walk'+(Math.floor(p.anim*8)%4+1); return 'idle'+(Math.floor(p.anim*2)%4+1)}

ctx.fillStyle='#7898b0';ctx.beginPath();ctx.moveTo(0,350);ctx.lineTo(150,210);ctx.lineTo(270,350);ctx.lineTo(400,190);ctx.lineTo(560,350);ctx.lineTo(710,220);ctx.lineTo(900,350);ctx.lineTo(960,300);ctx.lineTo(960,430);ctx.lineTo(0,430);ctx.fill();
