<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ねこビーム！ Stage 1 v16</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79c9ef;font-family:system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{touch-action:manipulation!important;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:7px;z-index:5;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 2px 4px #123}
.badge{background:#082a58e8;border:2px solid #bcecff;border-radius:15px;padding:7px 10px;white-space:nowrap}
#sound{position:fixed;right:10px;top:max(60px,calc(env(safe-area-inset-top) + 52px));z-index:12;border:2px solid #bcecff;border-radius:14px;background:#082a58ef;color:#fff;padding:9px 13px;font-weight:900}
#hint{position:fixed;left:10px;top:max(60px,calc(env(safe-area-inset-top) + 52px));z-index:6;color:#fff;background:#082a58c9;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:800;pointer-events:none}
#controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 12px;z-index:10;pointer-events:none}
.grp{display:flex;gap:10px}
.ctrl{pointer-events:auto;width:82px;height:68px;border-radius:21px;border:2px solid #c9f2ff;background:#0b3c79ed;color:#fff;font-size:31px;font-weight:900;box-shadow:0 5px 14px #0005;touch-action:none}
.ctrl:active{transform:scale(.94);background:#1468bf}
#message{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0006;z-index:30}
.card{background:#092750f7;color:#fff;border:3px solid #bcecff;border-radius:24px;padding:25px 30px;text-align:center;font-weight:900;font-size:24px;box-shadow:0 12px 40px #0008}
.card button{margin-top:15px;border:0;border-radius:15px;padding:12px 24px;font-size:18px;font-weight:900}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="badge">❤️ <span id="hp">3</span>　🐾 <span id="coin">0</span></div>
 <div class="badge">SCORE <span id="score">0</span></div>
 <div class="badge">STAGE 1</div>
</div>
<div id="hint">← → 移動　↑ ジャンプ　👁 ビーム　📦ゴールへ</div>
<button id="sound">🔊 音をON</button>
<div id="controls">
 <div class="grp"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
 <div class="grp"><button class="ctrl" id="jump">▲</button><button class="ctrl" id="beam">👁</button></div>
</div>
<div id="message"><div class="card"><div id="messageText"></div><button id="restart">🔄 リスタート</button></div></div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1;
let bgCanvas=null,bgCtx=null;
function makeBackground(){
  const ww=2900; bgCanvas=document.createElement('canvas'); bgCanvas.width=ww*DPR; bgCanvas.height=H*DPR;
  bgCtx=bgCanvas.getContext('2d'); bgCtx.setTransform(DPR,0,0,DPR,0,0);
  const g=bgCtx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#54c8ff');g.addColorStop(1,'#e5faff');bgCtx.fillStyle=g;bgCtx.fillRect(0,0,ww,H);
  bgCtx.fillStyle='#8bbbd0'; for(let i=0;i<10;i++){let x=i*310;bgCtx.beginPath();bgCtx.moveTo(x,H*.58);bgCtx.lineTo(x+155,H*.18);bgCtx.lineTo(x+325,H*.58);bgCtx.fill()}
  bgCtx.fillStyle='#73c9df';bgCtx.fillRect(0,H*.53,ww,H*.47);
  bgCtx.fillStyle='#fff9'; for(let i=0;i<9;i++){let x=i*330+45,y=100+(i%2)*55;bgCtx.beginPath();bgCtx.arc(x,y,25,0,7);bgCtx.arc(x+35,y-6,34,0,7);bgCtx.arc(x+73,y+4,24,0,7);bgCtx.fill()}
}
function resize(){DPR=Math.min(devicePixelRatio||1,1.25);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);buildPlatforms();makeBackground()}
addEventListener('resize',resize);

let soundOn=true, audioUnlocked=false, audioPool={}, lastBeamSound=0, lastCoinSound=0, lastBeamShot=0;
function unlockSound(){
  if(audioUnlocked)return;
  audioUnlocked=true;
  for(const k in AUDIO){
    const a=new Audio(AUDIO[k]);
    a.preload='auto';
    a.playsInline=true;
    a.volume=.6;
    audioPool[k]=a;
  }
  const a=audioPool.start;
  if(a){a.currentTime=0;a.play().catch(()=>{})}
}

function coinTone(){
  if(!soundOn)return;
  // Use the already-unlocked audio pool so the coin sound plays immediately,
  // without creating/resuming a new audio node at pickup time.
  const a=audioPool.coin;
  if(!a)return;
  try{
    a.pause();
    a.currentTime=0;
    const p=a.play();
    if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
function playSound(k){
  if(!soundOn)return;
  if(!audioUnlocked)unlockSound();
  const a=audioPool[k];
  if(!a)return;
  if(k==='beam'){
    const now=performance.now();
    if(now-lastBeamSound<260)return;
    lastBeamSound=now;
  }
  try{
    a.pause();a.currentTime=0;
    const p=a.play();
    if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}

const keys={l:false,r:false};

function buildPlatforms(){
 const y=H*.72;
 platforms=[

  {x:2320,y:y,w:580,h:100}
 ];
}

function reset(){

 enemies=[
  {x:690,platform:1,vx:55,w:50,h:38,hp:2,type:'slime'},
  {x:1035,platform:2,vx:-50,w:50,h:38,hp:2,type:'slime'},
  {x:1340,platform:3,vx:48,w:54,h:40,hp:2,type:'bat'},

 ];

 ];

}
function jump(){
 if(!running)return;
 if(!audioUnlocked)unlockSound();
 if(player.on){player.vy=-720;player.on=false;playSound('jump')}
}
function fire(){
 if(!running)return;
 if(!audioUnlocked)unlockSound();
 player.attack=.18;
 // Keep the projectile list small so rapid beam taps never build up lag.
 if(shots.length>=6)shots.shift();
 shots.push({x:player.x+player.face*38,y:player.y+27,v:player.face*1000,life:.28});
 playSound('beam');
}
function hurt(){
 if(player.inv>0)return;
 hp--;player.inv=1.0;playSound('hurt');
 if(hp<=0){running=false;show('ゲームオーバー…')}
}
function show(t){document.getElementById('messageText').textContent=t;document.getElementById('message').style.display='flex'}
function hud(){document.getElementById('hp').textContent=hp;document.getElementById('score').textContent=score;document.getElementById('coin').textContent=coins?coins.filter(c=>c.got).length:0}

function hold(id,on,off){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();unlockSound();on();try{b.setPointerCapture(e.pointerId)}catch(_){}});
 b.addEventListener('pointerup',e=>{e.preventDefault();if(off)off()});
 b.addEventListener('pointercancel',()=>{if(off)off()});
}
hold('left',()=>keys.l=true,()=>keys.l=false);hold('right',()=>keys.r=true,()=>keys.r=false);
hold('jump',jump);hold('beam',fire);

function burst(x,y){for(let i=0;i<3;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.7)*180,t:.28})}

function update(dt){
 if(!running)return;
 const dir=(keys.r?1:0)-(keys.l?1:0);
 player.vx+=dir*1750*dt;player.vx*=Math.pow(.0008,dt);player.vx=Math.max(-300,Math.min(300,player.vx));
 if(player.vx>3)player.face=1;if(player.vx<-3)player.face=-1;
 player.x+=player.vx*dt;
 const oldBottom=player.y+player.h;
 player.vy+=1800*dt;player.y+=player.vy*dt;player.on=false;

 if(player.vy>=0){
  for(const pl of platforms){
   if(player.x+player.w*.72>pl.x&&player.x+player.w*.28<pl.x+pl.w&&oldBottom<=pl.y+5&&player.y+player.h>=pl.y){
    player.y=pl.y-player.h;player.vy=0;player.on=true;break;
   }
  }
 }
 if(player.x<0)player.x=0;
 if(player.y>H+80){running=false;show('落下しました…');return}
 player.inv=Math.max(0,player.inv-dt);player.anim+=dt*(Math.abs(player.vx)>30?12:4);player.attack=Math.max(0,player.attack-dt);
 const goalRight=2860;
 cameraX=Math.max(0,Math.min(Math.max(0,goalRight-W),player.x-W*.30));

 for(const e of enemies){
  const pl=platforms[e.platform],min=pl.x+18,max=pl.x+pl.w-18;
  e.x+=e.vx*dt;if(e.x<min||e.x>max){e.x=Math.max(min,Math.min(max,e.x));e.vx*=-1}
  e.y=pl.y-e.h-(e.type==='bat'?110+Math.sin(animClock/220)*18:0);
  if(e.hp>0&&Math.abs(e.x-player.x)<45&&Math.abs((e.y+e.h/2)-(player.y+player.h/2))<46)hurt();
 }
 for(const s of shots){
  s.x+=s.v*dt;s.life-=dt;
  for(const e of enemies)if(e.hp>0&&Math.abs(s.x-e.x)<45&&Math.abs(s.y-(e.y+e.h/2))<42){
   e.hp--;s.life=0;score+=100;playSound('hit');
  }
 }
 shots=shots.filter(s=>s.life>0&&s.x>cameraX-150&&s.x<cameraX+W+200);
 for(const c of coins){
  const cy=platforms[c.p].y-38;
  const faceX=player.x+(player.face>0?player.w*.78:player.w*.22); const faceY=player.y+player.h*.34; if(!c.got&&Math.hypot(c.x-faceX,cy-faceY)<34){c.got=true;score+=50;coinTone()}
 }
 if(player.x>2580){running=false;clear=true;score+=1000;show('🎉 キャットハウス到着！');playSound('clear')}
 hud();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 // Lightweight background: one cached canvas instead of rebuilding gradients every frame.
 if(bgCanvas)ctx.drawImage(bgCanvas,-cameraX*.15,0);

 for(const pl of platforms){
  const x=pl.x-cameraX;
  ctx.fillStyle='#60432d';ctx.fillRect(x,pl.y,pl.w,H-pl.y+150);
  ctx.fillStyle='#57d052';ctx.fillRect(x,pl.y,pl.w,15);
  ctx.fillStyle='#9a724d';

 ctx.beginPath();ctx.moveTo(gx+80,gy-148);ctx.lineTo(gx+97,gy-165);ctx.lineTo(gx+104,gy-140);ctx.closePath();ctx.fill();
 ctx.fillStyle='#4a3025';ctx.beginPath();ctx.arc(gx+72,gy-48,31,Math.PI,0);ctx.lineTo(gx+103,gy);ctx.lineTo(gx+41,gy);ctx.closePath();ctx.fill();
 ctx.fillStyle='#f3d0a0';ctx.beginPath();ctx.arc(gx+23,gy-48,8,0,Math.PI*2);ctx.fill();
 for(const [px,py] of [[gx+12,gy-61],[gx+23,gy-66],[gx+34,gy-61]]){ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle='#f1d19c';ctx.fillRect(gx+106,gy-91,76,36);
 ctx.fillStyle='#633f2d';ctx.font='900 17px system-ui';ctx.fillText('GOAL!',gx+114,gy-67);
 ctx.restore();
 for(const c of coins)if(!c.got){
  const x=c.x-cameraX,cy=platforms[c.p].y-38;

  ctx.fillStyle='#fff2a0';ctx.font='15px sans-serif';ctx.fillText('🐾',x-9,cy+6);
 }

 // Enemies with simple readable silhouettes.
 for(const e of enemies)if(e.hp>0){
  const x=e.x-cameraX;

   const flap=Math.sin(animClock/100)*8;
   ctx.fillStyle='#5c3a88';ctx.beginPath();ctx.ellipse(x,e.y,24,17,0,0,7);ctx.fill();

   ctx.fillStyle='#ef6b4b';ctx.beginPath();ctx.arc(x,e.y+13,25,Math.PI,0);ctx.fill();
   ctx.fillStyle='#f4d9a2';ctx.fillRect(x-24,e.y+13,48,23);
   ctx.fillStyle='#222';ctx.font='18px sans-serif';ctx.fillText('• •',x-13,e.y+29);
  }else{
   const squish=1+Math.sin(animClock/120)*.04;
   ctx.save();ctx.translate(x,e.y+22);ctx.scale(1,squish);
   ctx.fillStyle='#69d85b';ctx.beginPath();ctx.ellipse(0,0,30,22,0,0,7);ctx.fill();
   ctx.fillStyle='#143a2b';ctx.font='21px sans-serif';ctx.fillText('•ᴗ•',-18,7);ctx.restore();
  }
 }

 // Beam
 for(const s of shots){ctx.strokeStyle='#8dffff';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(s.x-cameraX,s.y);ctx.lineTo(s.x-cameraX-s.v*.05,s.y);ctx.stroke()}

 // Animated cat: bob, slight lean and squash while moving.
 if(player.inv<=0||Math.floor(player.inv*16)%2===0){
  const moving=Math.abs(player.vx)>35;
  const bob=moving?Math.sin(player.anim)*3:Math.sin(animClock/420)*1.5;
  const lean=moving?Math.sin(player.anim)*0.035:0;
  const squash=moving?1+Math.sin(player.anim)*0.025:1;
  const sc=.40,w=catImg.width*sc,h=catImg.height*sc;
  ctx.save();ctx.translate(player.x-cameraX+player.w/2,player.y+player.h+bob);
  if(player.face<0)ctx.scale(-1,1);
  ctx.rotate(lean);ctx.scale(1/squash,squash);
  ctx.shadowColor='#67eaff';ctx.shadowBlur=6;
  ctx.drawImage(catImg,-w/2,-h*.72,w,h);
  ctx.restore();
 }

}
let last=performance.now(), animClock=0,lastDraw=0;
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;animClock=t;update(dt);if(t-lastDraw>=32){lastDraw=t;draw()}requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script>
