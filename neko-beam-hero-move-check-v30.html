  <div id="controls">
    <button id="left">←</button>
    <button id="right">→</button>
  </div>
</div>
<script>
const wrap=document.getElementById('catWrap');
const leftBtn=document.getElementById('left');
const rightBtn=document.getElementById('right');

let x=50;
let left=false;
let right=false;
let last=performance.now();

function setHold(btn, side){
  const on=e=>{
    e.preventDefault();
    if(side==='left') left=true;
    else right=true;
    btn.setPointerCapture?.(e.pointerId);
  };
  const off=e=>{
    e.preventDefault();
    if(side==='left') left=false;
    else right=false;
  };
  btn.addEventListener('pointerdown',on);
  btn.addEventListener('pointerup',off);
  btn.addEventListener('pointercancel',off);
  btn.addEventListener('lostpointercapture',off);
}

setHold(leftBtn,'left');
setHold(rightBtn,'right');

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') left=true;
  if(e.key==='ArrowRight') right=true;
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft') left=false;
  if(e.key==='ArrowRight') right=false;
});

function loop(now){
  const dt=Math.min(0.03,(now-last)/1000);
  last=now;

  const speed=28; // percentage points per second
  if(left && !right) x-=speed*dt;
  if(right && !left) x+=speed*dt;

  x=Math.max(18,Math.min(82,x));
  wrap.style.left=x+'%';

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
