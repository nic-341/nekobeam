<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ねこビーム！ Stage 1 v13</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79c9ef;font-family:system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{touch-action:none!important;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:7px;z-index:5;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 2px 4px #123}
.badge{background:#082a58e8;border:2px solid #bcecff;border-radius:15px;padding:7px 10px;white-space:nowrap}
#sound{position:fixed;right:10px;top:max(60px,calc(env(safe-area-inset-top) + 52px));z-index:12;border:2px solid #bcecff;border-radius:14px;background:#082a58ef;color:#fff;padding:9px 13px;font-weight:900}
#hint{position:fixed;left:10px;top:max(60px,calc(env(safe-area-inset-top) + 52px));z-index:6;color:#fff;background:#082a58c9;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:800;pointer-events:none}
#controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 12px;z-index:10;pointer-events:none}
.grp{display:flex;gap:10px}
.ctrl{pointer-events:auto;width:82px;height:68px;border-radius:21px;border:2px solid #c9f2ff;background:#0b3c79ed;color:#fff;font-size:31px;font-weight:900;box-shadow:0 5px 14px #0005}
.ctrl:active{transform:scale(.94);background:#1468bf}
#message{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0006;z-index:30}
.card{background:#092750f7;color:#fff;border:3px solid #bcecff;border-radius:24px;padding:25px 30px;text-align:center;font-weight:900;font-size:24px;box-shadow:0 12px 40px #0008}
.card button{margin-top:15px;border:0;border-radius:15px;padding:12px 24px;font-size:18px;font-weight:900}
</style>
</head>

let audioUnlocked=false,soundOn=true,audioPool={},lastBeamSound=0;
function unlockSound(){
 if(audioUnlocked)return;
 audioUnlocked=true;
 for(const k in AUDIO){const a=new Audio(AUDIO[k]);a.preload='auto';a.playsInline=true;a.volume=.55;audioPool[k]=a;}
}
function playSound(k){
 if(!soundOn)return;
 const a=audioPool[k]; if(!a)return;
 try{a.currentTime=0;a.play().catch(()=>{})}catch(_ ){}
}
function beamSound(){
 const n=performance.now();
 if(n-lastBeamSound<420)return;
 lastBeamSound=n; playSound('beam');
}

function makeBackground(){
 const ww=2900;
 bgCanvas=document.createElement('canvas'); bgCanvas.width=ww; bgCanvas.height=Math.ceil(H);
 bgCtx=bgCanvas.getContext('2d');
 const g=bgCtx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#54c8ff');g.addColorStop(1,'#e5faff');bgCtx.fillStyle=g;bgCtx.fillRect(0,0,ww,H);
 bgCtx.fillStyle='#8bbbd0';
 for(let i=0;i<10;i++){let x=i*310;bgCtx.beginPath();bgCtx.moveTo(x,H*.58);bgCtx.lineTo(x+155,H*.18);bgCtx.lineTo(x+325,H*.58);bgCtx.fill()}
 bgCtx.fillStyle='#73c9df';bgCtx.fillRect(0,H*.53,ww,H*.47);
 bgCtx.fillStyle='#fff9';
 for(let i=0;i<9;i++){let x=i*330+45,y=100+(i%2)*55;bgCtx.beginPath();bgCtx.arc(x,y,25,0,7);bgCtx.arc(x+35,y-6,34,0,7);bgCtx.arc(x+73,y+4,24,0,7);bgCtx.fill()}
}
function buildPlatforms(){
 const y=H*.72;
 platforms=[
  {x:0,y:y,w:520,h:100},
  {x:600,y:y-85,w:260,h:100},
  {x:930,y:y,w:280,h:100},
  {x:1270,y:y-95,w:250,h:100},
  {x:1580,y:y-10,w:330,h:110},
  {x:1970,y:y-75,w:300,h:100},
  {x:2320,y:y,w:420,h:100}
 ];
}
function resize(){
 DPR=Math.min(devicePixelRatio||1,1.25);W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 buildPlatforms();makeBackground();
}
addEventListener('resize',resize);

let keys={l:false,r:false},player,platforms,enemies,coins,shots,particles,cameraX,score,hp,running,clear;
function reset(){
 buildPlatforms();
 player={x:120,y:platforms[0].y-62,w:62,h:62,vx:0,vy:0,on:true,face:1,inv:0,anim:0};
 enemies=[
  {x:690,platform:1,vx:55,w:50,h:38,hp:2,type:'slime'},
  {x:1035,platform:2,vx:-50,w:50,h:38,hp:2,type:'slime'},
  {x:1340,platform:3,vx:48,w:54,h:40,hp:2,type:'bat'},
  {x:1715,platform:4,vx:-55,w:50,h:38,hp:2,type:'slime'},
  {x:2110,platform:5,vx:55,w:50,h:40,hp:3,type:'mushroom'}
 ];
 coins=[
  {x:430,p:0,got:false},{x:660,p:1,got:false},{x:775,p:1,got:false},
  {x:1080,p:2,got:false},{x:1360,p:3,got:false},{x:1440,p:3,got:false},
  {x:1780,p:4,got:false},{x:1860,p:4,got:false},{x:2135,p:5,got:false},{x:2490,p:6,got:false}
 ];
 shots=[];particles=[];cameraX=0;score=0;hp=3;running=true;clear=false;
 document.getElementById('message').style.display='none';hud();
}
function jump(){
 if(!running)return;
 unlockSound();
 if(player.on){player.vy=-720;player.on=false;playSound('jump')}
}
function fire(){
 if(!running)return;
 unlockSound();
 player.attack=.12;
 if(shots.length>=5)shots.shift();
 shots.push({x:player.x+player.face*38,y:player.y+29,v:player.face*980,life:.42});
 beamSound();
}
function hurt(){
 if(player.inv>0)return;
 hp--;player.inv=.9;playSound('hurt');
 if(hp<=0){running=false;show('ゲームオーバー…')}
}
function show(t){document.getElementById('messageText').textContent=t;document.getElementById('message').style.display='flex'}
function hud(){document.getElementById('hp').textContent=hp;document.getElementById('score').textContent=score;document.getElementById('coin').textContent=coins?coins.filter(c=>c.got).length:0}

function hold(id,on,off){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();unlockSound();on();try{b.setPointerCapture(e.pointerId)}catch(_ ){}});
 b.addEventListener('pointerup',e=>{e.preventDefault();if(off)off()});
 b.addEventListener('pointercancel',()=>{if(off)off()});
}
hold('left',()=>keys.l=true,()=>keys.l=false);hold('right',()=>keys.r=true,()=>keys.r=false);
hold('jump',jump);hold('beam',fire);

document.getElementById('sound').addEventListener('pointerdown',e=>{
 e.preventDefault();soundOn=true;unlockSound();document.getElementById('sound').textContent='🔊 音ON';
});
document.getElementById('restart').addEventListener('pointerdown',e=>{e.preventDefault();unlockSound();reset()});

document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('touchend',e=>{if(e.target.tagName==='BUTTON')e.preventDefault()},{passive:false});
let lastTouch=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<420)e.preventDefault();lastTouch=n},{passive:false});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='z'||e.key==='Z')fire()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false});

function update(dt){
 if(!running)return;
 const dir=(keys.r?1:0)-(keys.l?1:0);
 player.vx+=dir*1750*dt;
 player.vx*=Math.pow(.0008,dt);
 player.vx=Math.max(-300,Math.min(300,player.vx));
 if(player.vx>3)player.face=1;if(player.vx<-3)player.face=-1;
 player.x+=player.vx*dt;
 const oldBottom=player.y+player.h;
 player.vy+=1800*dt;player.y+=player.vy*dt;player.on=false;
 if(player.vy>=0){
  for(const pl of platforms){
   if(player.x+player.w*.72>pl.x&&player.x+player.w*.28<pl.x+pl.w&&oldBottom<=pl.y+5&&player.y+player.h>=pl.y){
    player.y=pl.y-player.h;player.vy=0;player.on=true;break;
   }
  }
 }
 if(player.x<0)player.x=0;
 if(player.y>H+80){running=false;show('落下しました…');return}
 player.inv=Math.max(0,player.inv-dt);
 player.anim+=dt*(Math.abs(player.vx)>30?12:4);

 cameraX=Math.max(0,Math.min(Math.max(0,2740-W),player.x-W*.30));

 for(const e of enemies){
  if(e.hp<=0)continue;
  const pl=platforms[e.platform],min=pl.x+18,max=pl.x+pl.w-18;
  e.x+=e.vx*dt;if(e.x<min||e.x>max){e.x=Math.max(min,Math.min(max,e.x));e.vx*=-1}
  e.y=pl.y-e.h-(e.type==='bat'?105:0);
  if(Math.abs(e.x-player.x)<45&&Math.abs((e.y+e.h/2)-(player.y+player.h/2))<46)hurt();
 }
 for(const s of shots){
  s.x+=s.v*dt;s.life-=dt;
  if(s.life<=0)continue;
  for(const e of enemies){
   if(e.hp>0&&Math.abs(s.x-e.x)<42&&Math.abs(s.y-(e.y+e.h/2))<40){
    e.hp--;s.life=0;score+=100;playSound('hit');break;
   }
  }
 }
 shots=shots.filter(s=>s.life>0&&s.x>cameraX-120&&s.x<cameraX+W+180);

 for(const c of coins){
  if(c.got)continue;
  const cy=platforms[c.p].y-38;
  // 顔が触れるくらいの近さで取得
  const frontX=player.x+player.face*22;
  if(Math.abs(c.x-frontX)<23&&Math.abs(cy-(player.y+28))<42){
   c.got=true;score+=50;playSound('coin');
  }
 }
 if(player.x>2590){running=false;clear=true;score+=1000;show('🎉 ステージクリア！');playSound('clear')}
 hud();
}

function drawPlatform(pl){
 const x=pl.x-cameraX;
 ctx.fillStyle='#60432d';ctx.fillRect(x,pl.y,pl.w,H-pl.y+150);
 ctx.fillStyle='#57d052';ctx.fillRect(x,pl.y,pl.w,15);
 ctx.fillStyle='#9a724d';
 for(let k=0;k<Math.floor(pl.w/45);k++)ctx.fillRect(x+10+k*45,pl.y+32,25,10);
}

function drawCat(){
 if(player.inv>0&&Math.floor(player.inv*14)%2===1)return;
 const moving=Math.abs(player.vx)>35;
 const bob=moving?Math.sin(player.anim)*2.5:0;
 const sc=.39,w=catImg.width*sc,h=catImg.height*sc;
 ctx.save();
 ctx.translate(player.x-cameraX+player.w/2,player.y+player.h+bob);
 if(player.face<0)ctx.scale(-1,1);
 ctx.drawImage(catImg,-w/2,-h*.70,w,h);
 ctx.restore();
}

function drawHouse(){
 const gx=2670-cameraX,gy=platforms[6].y;
 // 入口の土台
 ctx.fillStyle='#9b6a3d';ctx.fillRect(gx,gy-78,112,78);
 // 段ボール本体
 ctx.fillStyle='#c9965a';ctx.fillRect(gx+8,gy-108,96,86);
 ctx.strokeStyle='#704524';ctx.lineWidth=4;ctx.strokeRect(gx+8,gy-108,96,86);
 // 屋根
 ctx.fillStyle='#b67b45';ctx.beginPath();ctx.moveTo(gx-2,gy-108);ctx.lineTo(gx+56,gy-150);ctx.lineTo(gx+114,gy-108);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#704524';ctx.stroke();
 // 猫耳
 ctx.fillStyle='#c9965a';ctx.beginPath();ctx.moveTo(gx+22,gy-118);ctx.lineTo(gx+31,gy-142);ctx.lineTo(gx+43,gy-122);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(gx+69,gy-122);ctx.lineTo(gx+82,gy-142);ctx.lineTo(gx+91,gy-118);ctx.closePath();ctx.fill();
 // 入口
 ctx.fillStyle='#51321f';ctx.beginPath();ctx.arc(gx+56,gy-44,27,Math.PI,0);ctx.lineTo(gx+83,gy);ctx.lineTo(gx+29,gy);ctx.closePath();ctx.fill();
 // 肉球
 ctx.fillStyle='#7a4b2b';ctx.beginPath();ctx.arc(gx+56,gy-120,7,0,7);ctx.fill();
 for(const dx of [-13,0,13]){ctx.beginPath();ctx.arc(gx+56+dx,gy-131-(Math.abs(dx)/13)*2,4,0,7);ctx.fill()}
 // GOAL
 ctx.fillStyle='#fff';ctx.font='900 18px system-ui';ctx.fillText('GOAL!',gx+28,gy-157);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 if(bgCanvas)ctx.drawImage(bgCanvas,-cameraX*.15,0);
 for(const pl of platforms)drawPlatform(pl);
 for(const c of coins)if(!c.got){
  const x=c.x-cameraX,cy=platforms[c.p].y-38;
  ctx.fillStyle='#ffd23d';ctx.beginPath();ctx.ellipse(x,cy,15,20,0,0,7);ctx.fill();
  ctx.strokeStyle='#d28c00';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff2a0';ctx.font='14px sans-serif';ctx.fillText('★',x-5,cy+5);
 }
 // 敵：単純な形だけにして描画負荷を抑える
 for(const e of enemies)if(e.hp>0){
  const x=e.x-cameraX;
  if(e.type==='bat'){
   ctx.fillStyle='#604080';ctx.beginPath();ctx.ellipse(x,e.y,22,16,0,0,7);ctx.fill();
   ctx.beginPath();ctx.moveTo(x-8,e.y);ctx.lineTo(x-45,e.y-22);ctx.lineTo(x-26,e.y+11);ctx.fill();
   ctx.beginPath();ctx.moveTo(x+8,e.y);ctx.lineTo(x+45,e.y-22);ctx.lineTo(x+26,e.y+11);ctx.fill();
   ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText('• •',x-10,e.y+5);
  }else if(e.type==='mushroom'){
   ctx.fillStyle='#e95d4a';ctx.beginPath();ctx.arc(x,e.y+12,24,Math.PI,0);ctx.fill();
   ctx.fillStyle='#f0d3a0';ctx.fillRect(x-23,e.y+12,46,24);
   ctx.fillStyle='#222';ctx.font='16px sans-serif';ctx.fillText('• •',x-11,e.y+28);
  }else{
   ctx.fillStyle='#69d85b';ctx.beginPath();ctx.ellipse(x,e.y+20,29,21,0,0,7);ctx.fill();
   ctx.fillStyle='#173c2b';ctx.font='18px sans-serif';ctx.fillText('•ᴗ•',x-16,e.y+6);
  }
 }
 // ロックマン風のビーム弾：光る球ではなく、小さな発射弾
 for(const s of shots){
  const x=s.x-cameraX;
  ctx.fillStyle='#8dffff';ctx.beginPath();ctx.arc(x,s.y,8,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-2,s.y-2,3,0,7);ctx.fill();
 }
 drawHouse();
 drawCat();
}
let last=performance.now(),lastDraw=0;
function loop(t){
 const dt=Math.min(.025,(t-last)/1000);last=t;
 update(dt);
 if(t-lastDraw>=33){lastDraw=t;draw()}
 requestAnimationFrame(loop);
}
resize();reset();requestAnimationFrame(loop);
</script>
</body></html>
