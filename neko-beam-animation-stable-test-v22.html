  <div id="laser"></div>
</div>
<div id="panel">🐱 猫アニメーション 安定テスト v22</div>
<div id="note">今回は猫の画像をフレーム交換しません。まず「崩れない動き」を確認します。</div>
<div id="controls">
 <div class="group"><button id="left">←</button><button id="right">→</button></div>
 <div class="group"><button id="jump">↑</button><button id="laserBtn">レーザー</button></div>
</div>
</div>
<script>
const wrap=document.getElementById('catWrap'), world=document.getElementById('world');
const laser=document.getElementById('laser'), shadow=document.getElementById('shadow');
let x=150,y=0,vy=0,dir=1,walking=false,last=performance.now(),walkT=0,laserT=0;
const k={l:false,r:false};
function jump(){if(y===0)vy=760}
function shoot(){laserT=0.13; laser.style.display='block'}
function render(){
 wrap.style.left=x+'px'; wrap.style.bottom=(62+y)+'px'; wrap.style.transform='scaleX('+dir+')';
 laser.style.left=(x+(dir>0?165:-130))+'px'; laser.style.bottom=(y+112)+'px'; laser.style.transform=dir>0?'none':'scaleX(-1)';
 shadow.style.transform='scaleX('+(1-Math.min(y/900,.45))+')';
}
function loop(t){
 const dt=Math.min(.025,(t-last)/1000);last=t;
 walking=k.l||k.r;
 if(k.l){x=Math.max(20,x-250*dt);dir=-1}
 if(k.r){x=Math.min(4600,x+250*dt);dir=1}
 if(y>0||vy>0){y+=vy*dt;vy-=1850*dt;if(y<=0){y=0;vy=0}}
 if(walking&&y===0){walkT+=dt*9;const bob=Math.sin(walkT)*2.2;wrap.style.marginBottom=bob+'px';wrap.style.rotate=(Math.sin(walkT*0.5)*.8)+'deg'} else {wrap.style.marginBottom='0';wrap.style.rotate='0deg'}
 if(laserT>0){laserT-=dt;if(laserT<=0)laser.style.display='none'}
 render();requestAnimationFrame(loop)
}
function hold(id,key){const b=document.getElementById(id);const on=e=>{e.preventDefault();k[key]=true};const off=e=>{e.preventDefault();k[key]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
hold('left','l');hold('right','r');
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.getElementById('laserBtn').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')k.l=true;if(e.key==='ArrowRight')k.r=true;if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key.toLowerCase()==='z')shoot()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')k.l=false;if(e.key==='ArrowRight')k.r=false});
render();requestAnimationFrame(loop);
</script>
