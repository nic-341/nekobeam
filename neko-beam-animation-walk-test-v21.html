const cat=document.getElementById('cat'),world=document.getElementById('world'),laser=document.getElementById('laser');
let x=180,y=0,vy=0,dir=1,moving=false,jumping=false,frame=0,last=performance.now(),laserUntil=0;
const keys={left:false,right:false};
walk.forEach(s=>{const im=new Image();im.src=s;});
cat.src=walk[0];
function layout(){cat.style.left=x+'px';cat.style.bottom=(y+70)+'px';cat.style.transform=`scaleX(${dir})`;world.style.transform=`translateX(${Math.min(0,-Math.max(0,x-250))}px)`;}
function jumpNow(){if(jumping)return;jumping=true;vy=720;cat.src=jump;}
function fire(){laserUntil=performance.now()+120;laser.style.display='block';laser.style.width='115px';laser.style.left=(x+(dir>0?102:-115))+'px';laser.style.bottom=(y+112)+'px';laser.style.transform=dir>0?'none':'scaleX(-1)';}
function loop(t){const dt=Math.min(.032,(t-last)/1000);last=t;
if(keys.left){x-=260*dt;dir=-1;moving=true} if(keys.right){x+=260*dt;dir=1;moving=true}
if(jumping){y+=vy*dt;vy-=1800*dt;if(y<=0){y=0;vy=0;jumping=false;cat.src=walk[0]}}
if(!jumping){if(keys.left||keys.right){frame=(frame+dt*8)%4;cat.src=walk[Math.floor(frame)]}else cat.src=walk[0]}
if(performance.now()>laserUntil)laser.style.display='none';layout();requestAnimationFrame(loop)}
function hold(el,key){const on=e=>{e.preventDefault();keys[key]=true};const off=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}
hold(document.getElementById('left'),'left');hold(document.getElementById('right'),'right');
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpNow()});
document.getElementById('laserBtn').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key==='ArrowUp'||e.key===' ')jumpNow();if(e.key.toLowerCase()==='z')fire()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
requestAnimationFrame(loop);
</script></body></html>
